# 个人工作台 Docker Compose 配置
# 使用方式：
#   首次启动：docker compose up -d
#   查看日志：docker compose logs -f
#   停止服务：docker compose down
#   重新构建：docker compose up -d --build

services:
  workbench:
    # 从当前目录的 Dockerfile 构建镜像
    build:
      context: .
      args:
        # 国内镜像加速源（默认 daocloud）；官方源用 node:20-alpine
        # 阿里云用 registry.cn-hangzhou.aliyuncs.com/library/node:20-alpine
        NODE_IMAGE: docker.m.daocloud.io/library/node:20-alpine
    # 镜像名称（也可用于直接 pull 已推送的镜像）
    image: personal-workbench:latest
    # 容器名称
    container_name: workbench
    # 端口映射：宿主机端口:容器端口
    # 如需改用其他端口（如 8080），修改左侧即可：8080:3110
    ports:
      - "3110:3110"
    # 数据持久化：将宿主机的 data.json 挂载到容器内
    # 这样容器重建后数据不丢失
    volumes:
      - ./data.json:/app/data.json
    # 环境变量（可覆盖默认端口）
    environment:
      - PORT=3110
      - NODE_ENV=production
    # 自动重启策略
    restart: unless-stopped
    # 健康检查（与 Dockerfile 中一致，compose 层面可覆盖）
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3110/api/data"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
